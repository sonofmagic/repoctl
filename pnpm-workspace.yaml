packages:
  - apps/*
  - packages/*
  - templates/*
  - '!**/test/**'

minimumReleaseAge: 0

versioning:
  fixed:
    - ['@icebreakers/monorepo', repoctl]
  ignore:
    - '@icebreakers/client'
  changelog:
    storage: repository

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true
  workerd: true
overrides:
  prettier: 3.9.6
  typescript: 6.0.3
  vite: 8.2.2
  postcss: 8.5.26
  postcss-selector-parser: 7.1.5
  js-yaml: 4.3.2
  nanoid: 6.0.1
  brace-expansion: 5.0.9
  cross-spawn: 7.0.6
  adm-zip: 0.6.0
  uuid: 14.0.2
  esbuild: 0.28.2
