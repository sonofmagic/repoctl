name: Automatic Release Intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: Comma-separated merged PR numbers to backfill
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate release intent
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Generate or backfill changesets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
        run: node .github/auto-changeset/index.mjs
